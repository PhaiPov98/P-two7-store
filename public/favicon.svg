<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="115" fill="url(#centerGlow)" />
  <rect width="508" height="508" x="2" y="2" rx="113" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Logo Graphics Group -->
  <g transform="translate(6, 0)">
    <!-- Stylized Outer P -->
    <path d="M 175 145 C 240 145, 365 145, 365 240 C 365 315, 290 330, 245 330 L 225 330 C 210 330, 195 342, 195 358 L 195 400 C 195 405, 185 410, 180 405 C 160 380, 150 350, 150 320 C 150 255, 175 145, 175 145 Z" 
          fill="none" 
          stroke="url(#neonPurple)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)" />

    <!-- Lightning Bolt (Zap) in Center -->
    <path d="M 285 95 L 180 265 L 265 265 L 210 420 L 335 240 L 250 240 Z" 
          fill="url(#boltGrad)" 
          stroke="#e0f2fe" 
          stroke-width="4"
          filter="url(#glow)" />
  </g>
</svg>
